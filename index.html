<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Blackpine Woods</title><meta name="description" content="A 32-bit pixel-art mushroom foraging adventure. Identify wild mushrooms, chop, fish and build a cabin, then explore caves, a marsh, a lake, a mountain ridge and a village to bring the Foragers' Club home."><meta name="theme-color" content="#16201a"></head><body>

<style>
/* Layout: app shell — sticky sidebar nav (top pill bar on phones), bento home, card decks, slide-over detail drawer */
:root{
  --bg:#f5f4ef;
  --panel:#ffffff;
  --panel-2:#eeede6;
  --ink:#141715;
  --ink-2:#464c48;
  --muted:#7a807b;
  --line:#e2e0d7;
  --accent:#b8580a;      /* chanterelle amber */
  --accent-ink:#ffffff;
  --moss:#47663a;
  --gold:#9a6f0c;
  --danger:#bf3529;
  --glow:rgba(184,88,10,.10);
  --paper:#ffffff;       /* backing for printed diagrams */
  --shadow:0 1px 0 rgba(20,23,21,.04),0 12px 32px -12px rgba(20,23,21,.12);
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d110f; --panel:#141a16; --panel-2:#1b221d; --ink:#ebefe9; --ink-2:#b6beb7; --muted:#7d8880;
  --line:#252d28; --accent:#f39a3d; --accent-ink:#1b1106; --moss:#9dc281; --gold:#e2b64a; --danger:#f07a6d;
  --glow:rgba(243,154,61,.12); --paper:#ecebe5; --shadow:0 1px 0 rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d110f; --panel:#141a16; --panel-2:#1b221d; --ink:#ebefe9; --ink-2:#b6beb7; --muted:#7d8880;
  --line:#252d28; --accent:#f39a3d; --accent-ink:#1b1106; --moss:#9dc281; --gold:#e2b64a; --danger:#f07a6d;
  --glow:rgba(243,154,61,.12); --paper:#ecebe5; --shadow:0 1px 0 rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.02em;font-weight:650}
p{margin:0 0 .8em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
em{font-style:italic}

/* ---------- generic ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid > *{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:20px}
.card h3{font-size:1.08rem;margin-bottom:8px}
.card p,.card li{color:var(--ink-2);font-size:.92rem}
.card p:last-child{margin-bottom:0}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.list li{position:relative;padding-left:18px;color:var(--ink-2);font-size:.92rem}
.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--accent);opacity:.75}
.term{font-family:var(--f-mono);font-size:.8rem;color:var(--ink);background:var(--panel-2);padding:1px 6px;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.02em;padding:3px 9px;border-radius:999px;
  background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.chip.moss{background:color-mix(in srgb,var(--moss) 14%,transparent);color:var(--moss)}
.chip.gold{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
.chip.amber{background:var(--glow);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.note{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r-md);padding:16px 18px;background:var(--panel);border:1px solid var(--line);margin:18px 0}
.note .dot{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--glow);color:var(--accent)}
.note .dot svg{width:16px;height:16px}
.note h4{font-size:.98rem;margin-bottom:4px;font-weight:650}
.note p{margin:0;color:var(--ink-2);font-size:.92rem}
.note.warn{background:color-mix(in srgb,var(--danger) 7%,var(--panel));border-color:color-mix(in srgb,var(--danger) 25%,var(--line))}
.note.warn .dot{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.note.law{background:color-mix(in srgb,var(--gold) 8%,var(--panel));border-color:color-mix(in srgb,var(--gold) 28%,var(--line))}
.note.law .dot{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
/* ---------- game: Blackpine Woods ---------- */
.wf-view{max-width:1180px}
.wf{display:flex;flex-direction:column;gap:10px}
.wf-stage{position:relative;width:100%;height:min(68vh,640px);min-height:340px;border-radius:var(--r-lg);overflow:hidden;background:#244b33;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none;outline:none;user-select:none;-webkit-user-select:none}
.wf-stage:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.wf-stage canvas{display:block;image-rendering:auto}
.wf-lv{pointer-events:auto;cursor:pointer}
.wf-hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;color:#f6f3ea;font-family:var(--f-mono);font-size:.78rem}
.wf-hl,.wf-hr{display:flex;flex-direction:column;gap:6px;background:rgba(12,16,13,.62);backdrop-filter:blur(6px);border-radius:12px;padding:8px 11px;min-width:0}
.wf-hr{align-items:flex-end}
.wf-clock{font-weight:600;font-size:.84rem}
.wf-bar{position:relative;width:150px;max-width:38vw;height:14px;border-radius:7px;background:rgba(255,255,255,.15);overflow:hidden}
.wf-bar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6fbf55,#a7d86a);transition:width .3s}
.wf-bar span.low{background:linear-gradient(90deg,#d9452f,#f08a4a)}
.wf-bar b{position:relative;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding-left:6px;line-height:14px;font-weight:600;color:#10140f}
.wf-coins{font-weight:600;font-size:.9rem}
.wf-lv{display:flex;align-items:center;gap:8px}
.wf-xp{width:90px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.wf-xp span{display:block;height:100%;background:#f3b54a}
.wf-quest{position:absolute;left:10px;bottom:10px;max-width:min(360px,60%);background:rgba(12,16,13,.66);backdrop-filter:blur(6px);color:#f6f3ea;border-radius:12px;padding:9px 12px;font-size:.78rem;line-height:1.4;pointer-events:none;display:flex;flex-direction:column;gap:3px}
.wf-quest b{font-family:var(--f-display);font-size:.9rem;color:#ffd789}
.wf-quest span{opacity:.9}
.wf-quest i{font-style:normal;font-family:var(--f-mono);color:#a7d86a}
.wf-prompt{position:absolute;background:#f6f3ea;color:#151815;font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:4px 8px;border-radius:7px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.wf-toasts{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:min(340px,70%);pointer-events:none}
.wf-toast{background:rgba(12,16,13,.82);color:#f6f3ea;font-size:.8rem;padding:8px 11px;border-radius:10px;line-height:1.35;animation:wfin .25s ease both;transition:opacity .4s,transform .4s}
.wf-toast.out{opacity:0;transform:translateY(6px)}
.wf-toast.xp{color:#ffd789}.wf-toast.coin{color:#f3d36a}.wf-toast.bad{background:rgba(120,30,20,.88)}.wf-toast.lvl{background:rgba(150,90,10,.92);color:#fff}
@keyframes wfin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wf-modal{position:absolute;inset:0;background:rgba(6,8,7,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.wf-box{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:100%;overflow-y:auto;padding:20px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.wf-box h3{font-size:1.4rem;font-weight:700;margin:2px 0 8px;padding-right:34px}
.wf-box p{color:var(--ink-2);font-size:.92rem}
.wf-box .muted,.wf-box span.muted{color:var(--muted)}
.wf-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.wf-photo{margin:-20px -20px 14px;aspect-ratio:16/9;overflow:hidden;background:var(--panel-2);border-radius:18px 18px 0 0}
.wf-photo img{width:100%;height:100%;object-fit:cover;display:block}
.wf-photo.nophoto{display:grid;place-items:center;background:linear-gradient(135deg,#2b2420,#4a3b30);color:#f1ece2;text-align:center;padding:20px}
.wf-photo.nophoto div{display:flex;flex-direction:column;gap:6px;max-width:34ch}
.wf-photo.nophoto span{font-size:.9rem;opacity:.9}
.wf-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.wf-opts .opt,.opt{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;text-align:left;font-size:.9rem;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--moss);background:color-mix(in srgb,var(--moss) 16%,var(--panel))}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--panel))}
.opt:disabled{cursor:default}
.qfb{border-radius:12px;padding:11px 13px;font-size:.88rem;line-height:1.5;margin:6px 0 10px}
.qfb.good{background:color-mix(in srgb,var(--moss) 14%,var(--panel));color:var(--ink)}
.qfb.bad{background:color-mix(in srgb,var(--danger) 12%,var(--panel));color:var(--ink)}
.wf-acts{display:flex;gap:8px;margin-top:12px}
.wf-acts.wrap{flex-wrap:wrap}
.wf-acts .btn:disabled,.wf-row .btn:disabled{opacity:.45;cursor:not-allowed}
.wf-list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.wf-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.88rem}
.wf-row > span:first-child{flex:1;min-width:0}
.wf-row .btn{padding:6px 11px;font-size:.8rem;white-space:nowrap}
.wf-row.col{flex-direction:column;align-items:stretch;gap:6px}
.wf-row.col .btn{align-self:flex-start}
.wf-reqs{display:flex;flex-wrap:wrap;gap:5px}
.wf-reqs span{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:999px}
.wf-reqs .ok{background:color-mix(in srgb,var(--moss) 16%,transparent);color:var(--moss)}
.wf-reqs .no{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.wf-say{font-style:italic}
.wf-warn{color:var(--danger)!important;font-weight:600}
.wf-sub{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.wf-chips{display:flex;flex-wrap:wrap;gap:6px}
.wf-jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.wf-j{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--ink-2);min-width:0}
.wf-j img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.wf-j b{color:var(--ink);font-size:.86rem}
.wf-j .chip{align-self:flex-start}
.wf-j.unk{opacity:.7}
.wf-jimg{aspect-ratio:4/3;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;color:var(--muted)}
.wf-pad{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 14px 14px;pointer-events:none}
.wf-dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);pointer-events:auto}
.wf-dpad button,.wf-a{border:0;border-radius:12px;background:rgba(246,243,234,.82);color:#151815;font-size:1.1rem;pointer-events:auto;touch-action:none}
.wf-dpad [data-k=up]{grid-column:2;grid-row:1}.wf-dpad [data-k=left]{grid-column:1;grid-row:2}.wf-dpad [data-k=right]{grid-column:3;grid-row:2}.wf-dpad [data-k=down]{grid-column:2;grid-row:3}
.wf-a{width:68px;height:68px;border-radius:50%;font-family:var(--f-display);font-weight:700;font-size:1.3rem;background:rgba(243,181,74,.92)}
.wf-toasts{max-width:min(340px,38%)}
@media (pointer:coarse),(max-width:720px){.wf-pad{display:flex}.wf-quest{bottom:auto;top:84px;max-width:52%;font-size:.72rem}.wf-toasts{bottom:auto;top:84px;right:10px;max-width:44%}.wf-quest span{display:none}}
.wf-bar2{display:flex;flex-wrap:wrap;gap:8px}
.wf-bar2 kbd{font-family:var(--f-mono);font-size:.68rem;background:var(--panel-2);border-radius:5px;padding:1px 5px;margin-left:4px;color:var(--muted)}
@media (pointer:coarse){.wf-bar2 kbd{display:none}}

/* ---------- game: handheld pixel style (a deliberate single look, same in light and dark) ---------- */
.wf-stage canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.wf-stage{--gb-ink:#283048;--gb-line:#384878;--gb-soft:#a8b8e0;--gb-paper:#f8f8f0;--gb-pix:"Geist","Segoe UI",system-ui,sans-serif;border:4px solid #283048;border-radius:14px}
.wf-hud{font-family:var(--gb-pix);font-size:.86rem}
.wf-hl,.wf-hr,.wf-quest,.wf-toast,.wf-prompt{background:var(--gb-paper);color:var(--gb-ink);backdrop-filter:none;border:3px solid var(--gb-line);box-shadow:inset 0 0 0 2px var(--gb-soft),0 3px 0 rgba(0,0,0,.25);border-radius:10px}
.wf-clock{font-size:.92rem;font-weight:600;letter-spacing:.02em}
.wf-bar{background:#384048;border:2px solid var(--gb-ink);height:12px;border-radius:6px;width:150px}
.wf-bar span{background:#58d080}
.wf-bar span.low{background:#f85838}
.wf-bar b{color:#fff;font-family:var(--gb-pix);font-size:.66rem;font-weight:700;line-height:9px;padding-left:4px;text-shadow:1px 1px 0 #283048}
.wf-coins{font-weight:700}
.wf-xp{background:#384048;border:2px solid var(--gb-ink);height:8px;border-radius:4px}
.wf-xp span{background:#58b8f8}
.wf-quest{font-family:var(--gb-pix)}
.wf-quest b{color:#c83828;font-family:var(--gb-pix);font-weight:700}
.wf-quest span{opacity:1;color:#485070}
.wf-quest i{color:#2f8a4a;font-family:var(--gb-pix)}
.wf-prompt{font-family:var(--gb-pix);font-size:.8rem;padding:4px 9px}
.wf-prompt::before{content:"▶ ";color:#c83828}
.wf-toast{font-family:var(--gb-pix);font-size:.82rem}
.wf-toast.xp{color:#2f6ab0}.wf-toast.coin{color:#a87810}
.wf-toast.bad{background:#fff0ec;color:#a02818;border-color:#a02818}
.wf-toast.lvl{background:#fff6d8;color:#7a4a00;border-color:#c89010}
.wf-modal{background:rgba(16,20,40,.45)}
.wf-box{background:var(--gb-paper);color:var(--gb-ink);border:4px solid var(--gb-line);box-shadow:inset 0 0 0 3px var(--gb-soft),0 12px 40px rgba(0,0,0,.4);border-radius:14px}
.wf-box h3{font-family:var(--gb-pix);font-weight:700;letter-spacing:0;color:var(--gb-ink)}
.wf-box .kicker{color:#c83828;font-family:var(--gb-pix);letter-spacing:.08em;font-weight:700}
.wf-box p,.wf-box li,.wf-box .list li{color:#485070}
.wf-box .muted,.wf-box span.muted{color:#7a82a0}
.wf-box b,.wf-box strong{color:var(--gb-ink)}
.wf-box .list li::before{background:#c83828}
.wf-box .btn{background:#ffffff;color:var(--gb-ink);border:2px solid var(--gb-line);font-family:var(--gb-pix);font-weight:600;border-radius:9px;box-shadow:0 2px 0 var(--gb-line)}
.wf-box .btn:hover:not(:disabled){background:#eef2fc}
.wf-box .btn.primary{background:#f8d048;color:#283048;border-color:#283048}
.wf-box .btn{font-variant-numeric:tabular-nums;letter-spacing:0}
.wf-box .btn.danger{background:#fff;color:#c02818;border-color:#c02818;box-shadow:0 2px 0 #c02818}
.wf-x{background:#fff;border:2px solid var(--gb-line);color:var(--gb-ink);font-family:var(--gb-pix)}
.wf-box .opt{background:#fff;color:var(--gb-ink);border:2px solid var(--gb-line);font-family:var(--gb-pix);font-size:.92rem;box-shadow:0 2px 0 var(--gb-line)}
.wf-box .opt:hover:not(:disabled){background:#eef2fc;border-color:var(--gb-line)}
.wf-box .opt::before{content:"▶ ";color:transparent}
.wf-box .opt:hover:not(:disabled)::before,.wf-box .opt:focus-visible::before{color:#c83828}
.wf-box .opt.right{background:#dcf4e0;border-color:#2f8a4a;color:#1d5a30}
.wf-box .opt.wrong{background:#fde4de;border-color:#c02818;color:#8a1c10}
.wf-box .qfb.good{background:#e4f6e8;color:#1d4a2a}
.wf-box .qfb.bad{background:#fde8e2;color:#6a1c10}
.wf-box .wf-row{background:#fff;border:2px solid #c8d0e8}
.wf-box .wf-reqs .ok{background:#dcf4e0;color:#1d6a34}
.wf-box .wf-reqs .no{background:#fde4de;color:#a02818}
.wf-box .wf-sub{color:#c83828;font-family:var(--gb-pix);letter-spacing:.06em}
.wf-box .chip{background:#e8ecf8;color:#384878}
.wf-box .chip.moss{background:#dcf4e0;color:#1d6a34}
.wf-box .chip.gold{background:#fbf0cc;color:#8a6200}
.wf-box .chip.amber{background:#fde4de;color:#a02818}
.wf-box .wf-j{background:#fff;border:2px solid #c8d0e8;color:#485070}
.wf-box .wf-j b{color:var(--gb-ink)}
.wf-box .wf-jimg{background:#e8ecf8;color:#7a82a0}
.wf-box .wf-warn{color:#c02818!important}
.wf-photo{border-bottom:3px solid var(--gb-line)}
.wf-dpad button,.wf-a{border:3px solid #283048;box-shadow:0 3px 0 #283048;font-family:var(--gb-pix)}
.wf-a{background:#f85838;color:#fff}

/* ---------- game: dialogue box, area banner, fade, map ---------- */
.wf-dlg{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;display:flex;gap:12px;align-items:flex-start;background:var(--gb-paper);color:var(--gb-ink);border:4px solid var(--gb-line);border-radius:14px;box-shadow:inset 0 0 0 3px var(--gb-soft),0 6px 0 rgba(0,0,0,.25);padding:12px 14px 14px;font-family:var(--gb-pix);cursor:pointer;max-height:62%;overflow-y:auto}
.wf-dpor{flex:0 0 auto;width:56px;height:56px;image-rendering:pixelated;background:#e8ecf8;border:3px solid var(--gb-line);border-radius:10px;padding:2px}

function wfZoneData(id){
  var cfg=ZCFG[id],w=ZONES[id].w,h=ZONES[id].h,m=cfg.gen(),r=wfRng(cfg.seed),reach=wfReachZ(m,w,h,cfg.start[0],cfg.start[1]),used={},spawns=[],sid=0;

  var npcs=[];(cfg.npcs||[]).forEach(function(n){var p=n.pos;if(!p){var l=cand0.filter(function(q){return n.crit(q)&&wfChestOk(m,w,h,q[0],q[1]);});if(!l.length)l=cand0.filter(function(q){return n.crit(q);});if(!l.length)l=cand0;p=pickFrom(l,1)[0];}else used[p[0]+","+p[1]]=1;
    for(var j=-1;j<=1;j++)for(var i=-1;i<=1;i++)used[(p[0]+i)+","+(p[1]+j)]=1;npcs.push({id:n.id,zone:id,x:p[0],y:p[1]});});
  if(id==="woods")spawns=wfSpawns(m);
  else(cfg.rules||[]).forEach(function(rl){pickFrom(cand0.filter(function(p){return test[rl[2]](p[0],p[1]);}),rl[1]).forEach(function(p){spawns.push({id:sid++,sp:rl[0],x:p[0],y:p[1],up:1,back:0,idDay:-1});});});

 pip:{

 moss:{

      if(b.stage==="colonising"){if(w){b.prog++;b.dry=0;}else b.dry=(b.dry||0)+1;if(b.dry>=3){b.stage="dead";return"An oyster bed dried out completely. Keep it misted!";}if(b.prog>=2){b.stage="pinning";b.prog=0;return"Oyster bed fully colonised. Keep misting to trigger pins.";}}
      else if(b.stage==="pinning"){if(w){b.stage="fruiting";return"Tiny oyster pins appeared!";}}
      else if(b.stage==="fruiting"){if(w){b.stage="ready";b.readyDay=st.day;return"Oysters are ready: the veils are tearing. Harvest today or tomorrow.";}}
      else if(b.stage==="ready"){if(st.day-b.readyDay>=2){b.flush++;b.stage=b.flush>=3?"spent":"resting";b.prog=0;return"Oysters over-ripened and spoiled. Harvest sooner next time.";}}
      else if(b.stage==="resting"){b.prog++;if(b.prog>=1){b.stage=b.flush>=3?"spent":"pinning";b.prog=0;}}
    }else{
      if(b.stage==="colonising"){b.prog+=w?1.5:1;if(b.prog>=4){b.stage="waiting";b.prog=0;return"Your shiitake logs are fully colonised. Soak them to make them fruit.";}}
      else if(b.stage==="waiting"){if(w){b.stage="fruiting";return"Soaked shiitake logs are pushing out pins.";}}
      else if(b.stage==="fruiting"){b.stage="ready";b.readyDay=st.day;return"Shiitake are ready to harvest!";}
      else if(b.stage==="ready"){if(st.day-b.readyDay>=3){b.stage="resting";b.prog=0;return"Shiitake over-ripened on the logs.";}}
      else if(b.stage==="resting"){b.prog++;if(b.prog>=2){b.stage="waiting";b.prog=0;}}
    }
    return null;
  }

  /* ----- storage: a bank for basket items, at camp (and through Wren or Bram) ----- */
  function bankCount(){var n=0;for(var k in st.bank.items)n+=st.bank.items[k];return n;}
  function bankPut(k,n){var room=st.bank.cap-bankCount();n=Math.min(n,room,st.inv[k]||0);if(n<=0)return 0;st.inv[k]-=n;if(!st.inv[k])delete st.inv[k];st.bank.items[k]=(st.bank.items[k]||0)+n;return n;}
  function bankTake(k,n){var room=Math.max(0,st.cap-invCount(st));n=Math.min(n,room,st.bank.items[k]||0);if(n<=0)return 0;st.bank.items[k]-=n;if(!st.bank.items[k])delete st.bank.items[k];st.inv[k]=(st.inv[k]||0)+n;return n;}

    var used=bankCount(),full=used>=st.bank.cap,bfull=invCount(st)>=st.cap;
    var basket=Object.keys(st.inv).filter(function(k){return st.inv[k]>0;});
    var stored=Object.keys(st.bank.items).filter(function(k){return st.bank.items[k]>0;}).sort(function(a,b){return IT(a).n<IT(b).n?-1:1;});

      +(basket.length?'<div class="wf-list">'+basket.map(function(k){return '<div class="wf-row"><span>'+icon(k)+'<b>'+esc(IT(k).n)+'</b> ×'+st.inv[k]+'</span>'+btn("p1:"+k,"Store 1","",full)+btn("pa:"+k,"Store all","",full)+'</div>';}).join('')+'</div>'
        +'<div class="wf-acts">'+btn("all","Store whole basket","primary",full)+'</div>':'<p class="muted">Empty.</p>')
      +(full?'<p class="wf-warn">Storage is full.'+(st.bank.cap<250?' Upgrade it from the build sign at camp.':'')+'</p>':'')
      +'<div class="wf-sub">In storage</div>'
      +(stored.length?'<div class="wf-list">'+stored.map(function(k){return '<div class="wf-row"><span>'+icon(k)+'<b>'+esc(IT(k).n)+'</b> ×'+st.bank.items[k]+'</span>'+btn("t1:"+k,"Take 1","",bfull)+btn("ta:"+k,"Take all","",bfull)+'</div>';}).join('')+'</div>':'<p class="muted">Nothing stored yet.</p>')
      +(back?'<div class="wf-acts">'+btn("back","← Back")+'</div>':'');

      b.querySelectorAll('[data-a^="p1:"],[data-a^="pa:"]').forEach(function(e){e.onclick=function(){var k=e.dataset.a.slice(3);bankPut(k,e.dataset.a.charAt(1)==="a"?st.inv[k]:1);save();bankMenu(back);};});
      b.querySelectorAll('[data-a^="t1:"],[data-a^="ta:"]').forEach(function(e){e.onclick=function(){var k=e.dataset.a.slice(3);if(!bankTake(k,e.dataset.a.charAt(1)==="a"?st.bank.items[k]:1))toast("Your basket is full.","bad");save();bankMenu(back);};});});

  function helpMenu(first){

      +'<div class="wf-sub">Three skills</div><ul class="list"><li><b>🍄 Foraging:</b> examine a mushroom (cap, underneath, stem, smell), then name it. Get it right to pick it.</li><li><b>🪓 Woodcutting:</b> face a tree with an axe and press E once. You keep chopping by yourself until it comes down (2 to 10 logs a tree). Walk away any time to stop. Birch at level 1, oak at 5, willow at 12, pine at 16, mountain pine at 24.</li><li><b>🎣 Fishing:</b> fish only bite at <b>fishing spots</b>, where the water ripples and fish jump. They move every minute or two, like real shoals. Stand next to one with a rod and worms and press E. Each spot holds different fish: shallows, trout riffles, weed beds, drop-offs, deep holes and more. Once you start, you fish by yourself, hooking bites and recasting, until the spot moves, your basket fills, you run out of worms or you walk away. Better fish need higher levels and better rods.</li></ul>'

  /* ----- loop ----- */
  var DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  function heldDir(){if(keys.up)return"up";if(keys.down)return"down";if(keys.left)return"left";if(keys.right)return"right";return null;}
  function update(dt){
    if(modalOpen||dlg.open||warping)return;
    st.min+=dt*3.2;fishTick(dt);chopTick(dt);spotTick();faunaTick(dt);
    var h=st.min/60;
    if(h>=26){newDay(true);return;}
    if(pl.moving){var tx=pl.tx*TS,ty=pl.ty*TS,sp=TS*8*dt;var dx=tx-pl.px,dy=ty-pl.py,dist=Math.hypot(dx,dy);
      if(dist<=sp){pl.px=tx;pl.py=ty;pl.moving=false;var w=warpAt(pl.tx,pl.ty);if(w&&warpOk(w)){doWarp(w);return;}}
      else{pl.px+=dx/dist*sp;pl.py+=dy/dist*sp;}pl.step+=dt*14;}
    if(!pl.moving){var d=heldDir();if(d&&fishing){fishing=null;toast("You reel in your line.");}if(d&&chopping)chopping=null;if(d){st.dir=d;var nx=pl.tx+DIRS[d][0],ny=pl.ty+DIRS[d][1];
      var wn=warpAt(nx,ny);if(wn&&!warpOk(wn)){keys={};tryDoor(wn);return;}
      if(!blocked(nx,ny)){pl.tx=nx;pl.ty=ny;pl.moving=true;var drain=0.08*(h>=22&&!darkZone()?2.5:1)*(st.tools.boots?0.5:1);st.energy=Math.max(0,st.energy-drain);
        if(st.energy<=0){newDay(true);}}}}
  }
  var nightWarned=0;
  function hud(){
    var s=seasonOf(st.day);
    document.getElementById("wfClock").textContent="Day "+st.day+" · "+SEASONS[s]+" "+(darkZone()?"🕯":WICON[st.weather]||"")+" "+clock();
    var en=document.getElementById("wfEn");en.style.width=Math.max(0,st.energy)+"%";en.className=st.energy<25?"low":"";
    document.getElementById("wfCoins").textContent="🪙 "+st.coins;
    var ls=lastSkill,l=sk(ls),lo=xpAt(l),hi=xpAt(l+1);document.getElementById("wfLv").innerHTML=Object.keys(SKILLN).map(function(k){return '<span class="'+(k===ls?"on":"")+'">'+SKILLI[k]+' '+sk(k)+'</span>';}).join(" ");
    document.getElementById("wfXp").style.width=(l>=MAXL?100:Math.min(100,((st.skills[ls]||0)-lo)/(hi-lo)*100))+"%";
    var hr=st.min/60;if(hr>=21&&nightWarned!==st.day&&!dlg.open){nightWarned=st.day;toast(campGear()?"🌙 It's getting late. Head home, or pitch camp right where you are.":"🌙 It's getting late. Head back to your shelter and sleep. (A camping kit from Wren lets you sleep anywhere.)","bad");}
  }
  function frame(t){
    if(!running)return;
    var dt=Math.min(0.05,(t-(last||t))/1000);last=t;
    update(dt);render(t);
    hudT+=dt;if(hudT>0.2){hudT=0;hud();}
    if(t-lastSave>20000){lastSave=t;save();}
    raf=requestAnimationFrame(frame);
  }

  /* ----- input ----- */
  var KM={ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"};
  function onKey(e){
    if(!document.getElementById("wfStage"))return;
    var tag=(e.target&&e.target.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA")return;
    if(modalOpen){if(e.key==="Escape"){close();e.preventDefault();}return;}
    var dir=KM[e.code];
    if(dlg.open){if(e.type!=="keydown")return;
      if(dir==="up"||dir==="left"){moveCur(-1);e.preventDefault();}
      else if(dir==="down"||dir==="right"){moveCur(1);e.preventDefault();}
      else if(e.code==="KeyE"||e.code==="Space"||e.code==="Enter"){if(!e.repeat)advance();e.preventDefault();}
      else if(e.key==="Escape"){dlgClose();save();e.preventDefault();}
      return;}
    if(dir){keys[dir]=e.type==="keydown";e.preventDefault();return;}
    if(e.type!=="keydown")return;
    if(e.code==="KeyE"||e.code==="Space"||e.code==="Enter"){if(!e.repeat)act();e.preventDefault();}
    else if(e.code==="KeyI"){invMenu();}else if(e.code==="KeyJ"){journalMenu();}else if(e.code==="KeyQ"){questsMenu();}else if(e.code==="KeyM"){mapMenu();}
  }
  document.addEventListener("keydown",onKey);document.addEventListener("keyup",onKey);UNLOCKEV.forEach(function(ev){document.addEventListener(ev,snd.unlock,true);});
  function onBlur(){keys={};}
  window.addEventListener("blur",onBlur);
  (function(){
    var aBtn=document.getElementById("wfPad").querySelector(".wf-a");
    aBtn.addEventListener("pointerdown",function(e){e.preventDefault();if(dlg.open){advance();return;}if(actsList[0])runAct(actsList[0]);else act();});
    var joy=document.getElementById("wfJoy"),knob=document.getElementById("wfKnob"),pid=null,cur=null;
    function setDir(d){
      if(d===cur)return;
      if(dlg.open){if(d==="up"||d==="left")moveCur(-1);else if(d==="down"||d==="right")moveCur(1);}
      keys.up=keys.down=keys.left=keys.right=false;
      if(d&&!dlg.open)keys[d]=true;
      cur=d;
    }
    function track(e){
      var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2;
      var dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),max=R*0.62;
      var k=dist>max?max/dist:1;knob.style.transform="translate("+(dx*k)+"px,"+(dy*k)+"px)";
      if(dist<R*0.28){setDir(null);return;}
      setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
    }
    function end(e){if(e.pointerId!==pid)return;pid=null;knob.style.transform="";joy.classList.remove("on");setDir(null);}
    joy.addEventListener("pointerdown",function(e){e.preventDefault();pid=e.pointerId;try{joy.setPointerCapture(pid);}catch(_){}joy.classList.add("on");track(e);});
    joy.addEventListener("pointermove",function(e){if(e.pointerId===pid){e.preventDefault();track(e);}});
    joy.addEventListener("pointerup",end);joy.addEventListener("pointercancel",end);joy.addEventListener("lostpointercapture",end);
  })();
  document.getElementById("wfActs").addEventListener("pointerdown",function(e){var b=e.target.closest("[data-i]");if(!b)return;e.preventDefault();e.stopPropagation();runAct(actsList[+b.dataset.i]);});
  root.querySelector(".wf-bar2").addEventListener("click",function(e){var b=e.target.closest("[data-m]");if(!b)return;var m=b.dataset.m;
    if(m==="sound"){snd.unlock();snd.setMusic(!snd.music());sndBtn();toast(snd.music()?"♪ Music on":"Music off");return;}
    if(dlg.open)dlgClose();if(modalOpen)close();
    if(m==="inv")invMenu();else if(m==="journal")journalMenu();else if(m==="quests")questsMenu();else if(m==="map")mapMenu();else if(m==="help")helpMenu(false);else gameMenu();});
  function sndBtn(){var b=document.getElementById("wfSnd");if(b){b.textContent=snd.music()?"♪ Music":"♪ Off";b.setAttribute("aria-pressed",snd.music()?"true":"false");}}sndBtn();
  root.querySelector(".wf-lv").addEventListener("click",function(e){e.stopPropagation();if(dlg.open)dlgClose();skillsMenu();});
  root.addEventListener("contextmenu",function(e){var tg=e.target&&e.target.tagName;if(tg!=="TEXTAREA"&&tg!=="INPUT")e.preventDefault();});
  stage.addEventListener("pointerdown",function(){if(!modalOpen)stage.focus({preventScroll:true});});
  var ro=window.ResizeObserver?new ResizeObserver(function(){resize();}):null;if(ro)ro.observe(stage);else window.addEventListener("resize",resize);

  loadZone();resize();renderQuest();hud();raf=requestAnimationFrame(frame);
  if(st.intro)helpMenu(true);
  if(!canStore)toast("Your browser is blocking storage, so this game can't be saved.","bad");

  return {stop:function(){running=false;snd.stop();UNLOCKEV.forEach(function(ev){document.removeEventListener(ev,snd.unlock,true);});cancelAnimationFrame(raf);clearInterval(dlg.timer);save();document.removeEventListener("keydown",onKey);document.removeEventListener("keyup",onKey);window.removeEventListener("blur",onBlur);if(ro)ro.disconnect();WW=80;WH=56;}};
}

WF=wfCreate(document.getElementById("wfRoot"));
try{document.getElementById("wfStage").focus({preventScroll:true});}catch(e){}
</script>

</body></html>
